---
name: Notify Slack

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Post Slack notification
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
          CI_LOGS_BUCKET: ${{ secrets.CI_LOGS_BUCKET }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          BRANCH_S3="${BRANCH//\//-}"
          S3_BASE="https://${CI_LOGS_BUCKET}.s3.${AWS_DEFAULT_REGION}.amazonaws.com/runs/${BRANCH_S3}/${RUN_ID}/${RUN_ATTEMPT}"
          RUN_URL="https://github.com/${REPO}/actions/runs/${RUN_ID}"

          JOBS=$(gh api "repos/${REPO}/actions/runs/${RUN_ID}/jobs")

          job_conclusion() { echo "$JOBS" | jq -r --arg n "$1" '.jobs[] | select(.name == $n) | .conclusion'; }
          job_url()        { echo "$JOBS" | jq -r --arg n "$1" '.jobs[] | select(.name == $n) | .html_url'; }
          icon()           { [ "$1" = "success" ] && echo ":white_check_mark:" || echo ":x:"; }

          FMT_C=$(job_conclusion "fmt-clippy");       FMT_URL=$(job_url "fmt-clippy")
          INT_C=$(job_conclusion "integration-test"); INT_URL=$(job_url "integration-test")
          OVERALL=$(icon "$CONCLUSION"); FMT=$(icon "$FMT_C"); INT=$(icon "$INT_C")

          ARTIFACT_LINKS=""
          for f in setup.log devnet-info.json step_context.json version.txt post_start_status.log; do
            ARTIFACT_LINKS="${ARTIFACT_LINKS}• <${S3_BASE}/${f}|${f}>\n"
          done

          curl -fsSL -X POST -H 'Content-Type: application/json' \
            --data "$(jq -n \
              --arg ch  "$SLACK_CHANNEL" \
              --arg hdr "${OVERALL} *CI <${RUN_URL}|#${RUN_ID}> · \`${BRANCH}\`*" \
              --arg fmt "${FMT}  *fmt-clippy* — <${FMT_URL}|view>" \
              --arg int "${INT}  *integration-test* — <${INT_URL}|view>" \
              --arg art "$(printf '%b' "$ARTIFACT_LINKS")" \
              '{channel: $ch, blocks: [
                {type: "section", text: {type: "mrkdwn", text: $hdr}},
                {type: "section", fields: [
                  {type: "mrkdwn", text: $fmt},
                  {type: "mrkdwn", text: $int}
                ]},
                {type: "divider"},
                {type: "section", text: {type: "mrkdwn", text: ("*Artifacts*\n" + $art)}}
              ]}')" \
            "$SLACK_WEBHOOK_URL"
