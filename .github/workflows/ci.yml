name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v4

    - name: Setup Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v1

    - name: Build foc-localnet
      run: cargo build --release

    - name: Initialize foc-localnet
      run: ./target/release/foc-localnet init

    - name: Build Lotus
      run: ./target/release/foc-localnet build lotus

    - name: Build Curio
      run: ./target/release/foc-localnet build curio

    - name: Start cluster
      run: ./target/release/foc-localnet start

    - name: Check status
      run: ./target/release/foc-localnet status

    - name: Stop cluster
      run: ./target/release/foc-localnet stop

