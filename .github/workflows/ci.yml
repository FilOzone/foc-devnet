name: CI

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ main ]

jobs:
  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v4

    - name: Reclaim unused disk 
      uses: endersonmenezes/free-disk-space@v3
      with:
        remove_android: true
        remove_dotnet: true
        remove_haskell: true
        remove_tool_cache: true
        remove_swap: true
        remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
        remove_packages_one_command: true
        remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"
        rm_cmd: "rmz"
        rmz_version: "3.1.1"

    - name: Setup Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v1

    - name: Restore Rust cache
      uses: actions/cache/restore@v4
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-rust-build-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-rust-build-

    - name: Set up Docker
      uses: docker/setup-buildx-action@v3

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y tar

    - name: Build foc-localnet
      run: cargo build --release

    - name: Save Rust cache
      uses: actions/cache/save@v4
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-rust-build-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Copy foc-localnet binary and delete rust build cache
      run: |
        cp ./target/release/foc-localnet ./foc-localnet
        rm -rf ~/.cargo/registry/
        rm -rf ~/.cargo/git/db/
        rm -rf target/
        df -h

    - name: Initialize foc-localnet
      run: ./foc-localnet init

    - name: Remove YugabyteDB tarballs to save disk space
      run: |
        rm ~/.foc-localnet/artifacts/yugabyte-*.tar.gz
        df -h

    - name: Restore foc-builder cache
      uses: actions/cache/restore@v4
      with:
        path: ~/.foc-localnet/docker/volumes/cache/foc-builder
        key: ${{ runner.os }}-foc-builder-cache-${{ hashFiles('docker/**') }}-${{ hashFiles('src/config.rs') }}
        restore-keys: |
          ${{ runner.os }}-foc-builder-cache-

    - name: Show available disk space before builds
      run: df -h

    - name: Build Lotus
      run: ./foc-localnet build lotus

    - name: Build Curio
      run: ./foc-localnet build curio

    - name: Save foc-builder cache
      uses: actions/cache/save@v4
      with:
        path: ~/.foc-localnet/docker/volumes/cache/foc-builder
        key: ${{ runner.os }}-foc-builder-cache-${{ hashFiles('docker/**') }}-${{ hashFiles('src/config.rs') }}

    - name: Clean up Go modules after builds
      run: |
        sudo rm -rf ~/.foc-localnet/docker/volumes/cache
        sudo rm -rf ~/.foc-localnet/code/lotus
        sudo rm -rf ~/.foc-localnet/code/curio
        df -h

    - name: Restore filecoin-proof-params cache
      uses: actions/cache/restore@v4
      with:
        path: ~/.foc-localnet/docker/volumes/cache/filecoin-proof-params
        key: ${{ runner.os }}-filecoin-proof-params-2k-cache
        restore-keys: |
          ${{ runner.os }}-filecoin-proof-params-2k-cache-
        
    - name: Start cluster
      run: ./foc-localnet start --parallel

    - name: Save filecoin-proof-params cache
      uses: actions/cache/save@v4
      with:
        path: ~/.foc-localnet/docker/volumes/cache/filecoin-proof-params
        key: ${{ runner.os }}-filecoin-proof-params-2k-cache
    - name: Check status
      run: ./foc-localnet status

    - name: Stop cluster
      run: ./foc-localnet stop