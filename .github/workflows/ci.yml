name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v4

    - name: Setup Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v1

    - name: Cache Rust dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Set up Docker
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Cache Docker layers
      uses: actions/cache@v4
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-docker-${{ hashFiles('docker/**') }}
        restore-keys: |
          ${{ runner.os }}-docker-

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y tar

    - name: Build foc-localnet
      run: cargo build --release

    - name: Initialize foc-localnet
      run: ./target/release/foc-localnet init

    - name: Build Lotus
      run: ./target/release/foc-localnet build lotus

    - name: Build Curio
      run: ./target/release/foc-localnet build curio

    - name: Start cluster
      run: ./target/release/foc-localnet start

    - name: Check status
      run: ./target/release/foc-localnet status

    - name: Stop cluster
      run: ./target/release/foc-localnet stop

