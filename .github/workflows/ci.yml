---
name: CI

on:
  push:
    branches: ['*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      curio:
        description: >
          Curio source location override (e.g., 'gitbranch:main', 'gitcommit:abc123',
          'gittag:v1.0.0'). Leave empty for default.
        required: false
        default: ""
        type: string
      lotus:
        description: >
          Lotus source location override (e.g., 'gitbranch:main', 'gitcommit:abc123',
          'gittag:v1.34.4-rc1'). Leave empty for default.
        required: false
        default: ""
        type: string
      filecoin_services:
        description: >
          Filecoin Services source location override (e.g., 'gitbranch:main',
          'gitcommit:abc123'). Leave empty for default.
        required: false
        default: ""
        type: string

jobs:
  fmt-clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v4

    - name: Setup Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        components: rustfmt, clippy

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Run clippy
      run: cargo clippy --all-targets --all-features -- -D warnings

  integration-test:
    runs-on: ["self-hosted", "linux", "x64", "16xlarge+gpu"]
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4

    - name: "Setup devnet"
      id: devnet-setup
      uses: ./.github/actions/devnet-setup
      with:
        start-flags: "--parallel"  # This tests for basic synapse-sdk end-to-end
        enable-caching: "true"
        curio: ${{ inputs.curio || '' }}
        lotus: ${{ inputs.lotus || '' }}
        filecoin-services: ${{ inputs.filecoin_services || '' }}

    # ── Post-start validation ────────────────────
    - name: "CHECK: {Verify devnet-info.json exists}"
      if: steps.devnet-setup.outputs.start-outcome == 'success'
      run: |
        DEVNET_INFO="$HOME/.foc-devnet/state/latest/devnet-info.json"
        test -f "$DEVNET_INFO" || exit 1
        echo "✓ devnet-info.json created"
        jq '.version' "$DEVNET_INFO"

    # ── Schema & examples validation ─────────────
    - name: "EXEC: {Setup Node.js}"
      if: steps.devnet-setup.outputs.start-outcome == 'success'
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: "CHECK: {Validate devnet-info.json schema (zod)}"
      if: steps.devnet-setup.outputs.start-outcome == 'success'
      run: |
        DEVNET_INFO="$HOME/.foc-devnet/state/latest/devnet-info.json"
        cd examples
        npm install
        node validate-schema.js "$DEVNET_INFO"
        echo "✓ Schema validation passed"

    - name: "CHECK: {Run devnet-info examples}"
      if: steps.devnet-setup.outputs.start-outcome == 'success'
      run: |
        DEVNET_INFO="$HOME/.foc-devnet/state/latest/devnet-info.json"
        cd examples
        node read-devnet-info.js "$DEVNET_INFO"
        node check-balances.js "$DEVNET_INFO"
        echo "✓ All examples ran well"

    # ── Cleanup ──────────────────────────────────
    - name: "EXEC: {Stop cluster}"
      if: always()
      run: ./foc-devnet stop

    - name: "CHECK: {Fail job if start failed}"
      if: always() && steps.devnet-setup.outputs.start-outcome == 'failure'
      run: |
        echo "Start cluster failed earlier; marking job as failed." >&2
        exit 1
