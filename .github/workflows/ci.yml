---
name: CI

on:
  push:
    branches: ['*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      pdp_caching_test:
        description: Run PDP caching layers e2e test
        required: false
        default: true
        type: boolean
      curio:
        description: >
          Curio source location override (e.g., 'gitbranch:main', 'gitcommit:abc123',
          'gittag:v1.0.0'). Leave empty for default.
        required: false
        default: ""
        type: string
      lotus:
        description: >
          Lotus source location override (e.g., 'gitbranch:main', 'gitcommit:abc123',
          'gittag:v1.34.4-rc1'). Leave empty for default.
        required: false
        default: ""
        type: string
      filecoin_services:
        description: >
          Filecoin Services source location override (e.g., 'gitbranch:main',
          'gitcommit:abc123'). Leave empty for default.
        required: false
        default: ""
        type: string
      synapse_sdk:
        description: >
          Synapse SDK source location override (e.g., 'gitbranch:main',
          'gitcommit:abc123', 'gittag:synapse-sdk-v0.36.1'). Leave empty for default.
        required: false
        default: ""
        type: string

jobs:
  fmt-clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v4

    - name: Setup Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        components: rustfmt, clippy

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Run clippy
      run: cargo clippy --all-targets --all-features -- -D warnings

  integration-test:
    runs-on: ["self-hosted", "linux", "x64", "16xlarge+gpu"]
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v4

    # Free up disk space on GitHub Actions runner to avoid "no space left" errors
    - name: "EXEC: {Free up disk space}, independent"
      uses: endersonmenezes/free-disk-space@v3
      with:
        remove_android: true
        remove_dotnet: true
        remove_haskell: true
        remove_tool_cache: true
        remove_swap: true
        remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
        remove_packages_one_command: true
        remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"
        rm_cmd: "rmz"
        rmz_version: "3.1.1"

    # Setup Rust toolchain and restore cached dependencies
    - name: "EXEC: {Setup Rust toolchain}, independent"
      uses: actions-rust-lang/setup-rust-toolchain@v1

    # CACHE-RUST: Rust dependencies and build artifacts
    # These are keyed on the Cargo.lock file to ensure cache validity
    - name: "CACHE_RESTORE: {C-rust-cache}"
      id: cache-rust
      uses: actions/cache/restore@v4
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-rust-build-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-rust-build-

    # Setup Docker for building and running containers
    - name: "EXEC: {Setup Docker}, independent"
      uses: docker/setup-buildx-action@v3

    - name: "EXEC: {Install build dependencies}, independent"
      run: |
        sudo apt-get update
        sudo apt-get install -y tar openssl pkg-config libssl-dev

    # Build the foc-devnet binary
    - name: "EXEC: {Build foc-devnet binary}, DEP: {C-rust-cache}"
      run: cargo build --release

    # CACHE-RUST: Save Rust build cache for future runs
    - name: "CACHE_SAVE: {C-rust-cache}"
      if: steps.cache-rust.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-rust-build-${{ hashFiles('**/Cargo.lock') }}
    
    # Copy binary and clean up Rust artifacts to save disk space
    - name: "EXEC: {Copy binary and clean cache}, DEP: {C-rust-cache}"
      run: |
        cp ./target/release/foc-devnet ./foc-devnet
        rm -rf ~/.cargo/registry/
        rm -rf ~/.cargo/git/db/
        rm -rf target/
        df -h

    # Compute cache keys based on version info and source files
    # - CODE_HASH: Changes when Lotus/Curio versions change (for build artifacts cache)
    # - DOCKER_HASH: Changes when Dockerfiles change (for Docker images cache)
    - name: "CHECK: {Compute version hashes}"
      id: version-hashes
      run: |   
        # Get version output
        VERSION_OUTPUT=$(./foc-devnet version 2>&1)
        
        # Compute CODE_HASH from all default:code: lines (Lotus/Curio versions)
        CODE_HASH=$(echo "$VERSION_OUTPUT" | grep 'default:code:' | sha256sum | cut -d' ' -f1)
        echo "code-hash=$CODE_HASH" >> $GITHUB_OUTPUT
        echo "CODE_HASH: $CODE_HASH"
        
        # Compute DOCKER_HASH from docker/ directory (Dockerfile changes)
        DOCKER_HASH=$(find docker -type f -exec sha256sum {} \; | sort | sha256sum | cut -d' ' -f1)
        echo "docker-hash=$DOCKER_HASH" >> $GITHUB_OUTPUT
        echo "DOCKER_HASH: $DOCKER_HASH"

    # CACHE-DOCKER: Try to restore pre-built Docker images (foc-lotus, foc-lotus-miner, foc-builder, foc-curio, foc-yugabyte)
    # These images contain YugabyteDB and all build dependencies
    - name: "CACHE_RESTORE: {C-docker-images-cache}"
      id: cache-docker-images
      uses: actions/cache/restore@v4
      with:
        path: ~/.docker-images-cache
        key: ${{ runner.os }}-docker-images-${{ steps.version-hashes.outputs.docker-hash }}

    # CACHE-DOCKER: If Docker images are cached, load them from tarballs
    - name: "EXEC: {Load Docker images}, DEP: {C-docker-images-cache}"
      if: steps.cache-docker-images.outputs.cache-hit == 'true'
      run: |
        echo "Loading Docker images from cache..."
        for image in ~/.docker-images-cache/*.tar; do
          if [ -f "$image" ]; then
            echo "Loading $(basename $image)..."
            docker load -i "$image"
          fi
        done
        echo "Docker images loaded successfully, list:"
        docker images
        rm -rf ~/.docker-images-cache
        df -h

    # Build init flags from component override inputs (empty for push/PR events)
    - name: "CHECK: {Build init flags from inputs}"
      id: init-flags
      run: |
        FLAGS=""
        if [ -n "${{ inputs.curio }}" ]; then
          FLAGS="$FLAGS --curio ${{ inputs.curio }}"
        fi
        if [ -n "${{ inputs.lotus }}" ]; then
          FLAGS="$FLAGS --lotus ${{ inputs.lotus }}"
        fi
        if [ -n "${{ inputs.filecoin_services }}" ]; then
          FLAGS="$FLAGS --filecoin-services ${{ inputs.filecoin_services }}"
        fi
        if [ -n "${{ inputs.synapse_sdk }}" ]; then
          FLAGS="$FLAGS --synapse-sdk ${{ inputs.synapse_sdk }}"
        fi
        echo "flags=$FLAGS" >> $GITHUB_OUTPUT
        echo "Init flags: $FLAGS"

        # Set PDP test mode flag for use in step conditions throughout this job
        if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.pdp_caching_test }}" = "true" ]; then
          echo "pdp-test=true" >> $GITHUB_OUTPUT
        else
          echo "pdp-test=false" >> $GITHUB_OUTPUT
        fi

    # If Docker images are cached, skip building them AND skip downloading YugabyteDB
    # (YugabyteDB is already baked into the foc-yugabyte Docker image)
    - name: "EXEC: {Initialize with cached Docker}, DEP: {C-docker-images-cache}"
      if: steps.cache-docker-images.outputs.cache-hit == 'true'
      run: |
        rm -rf ~/.foc-devnet
        ./foc-devnet init --no-docker-build ${{ steps.init-flags.outputs.flags }}

    # If Docker images are not cached, do full init (downloads YugabyteDB and builds all images)
    - name: "EXEC: {Initialize without cache}, independent"
      if: steps.cache-docker-images.outputs.cache-hit != 'true'
      run: |
        rm -rf ~/.foc-devnet
        ./foc-devnet init ${{ steps.init-flags.outputs.flags }}

    # CACHE-DOCKER: Build Docker images if not cached
    - name: "EXEC: {Build Docker images}, DEP: {C-docker-images-cache}"
      if: steps.cache-docker-images.outputs.cache-hit != 'true'
      run: |-
        mkdir -p ~/.docker-images-cache
        echo "Building Docker images for cache..."
        docker save foc-lotus -o ~/.docker-images-cache/foc-lotus.tar
        docker save foc-lotus-miner -o ~/.docker-images-cache/foc-lotus-miner.tar
        docker save foc-builder -o ~/.docker-images-cache/foc-builder.tar
        docker save foc-curio -o ~/.docker-images-cache/foc-curio.tar
        docker save foc-yugabyte -o ~/.docker-images-cache/foc-yugabyte.tar
        echo "Docker images saved to cache"
        ls -lath ~/.docker-images-cache/
        df -h

    # CACHE-DOCKER: Save Docker images cache for future runs
    - name: "CACHE_SAVE: {C-docker-images-cache}"
      if: steps.cache-docker-images.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ~/.docker-images-cache
        key: ${{ runner.os }}-docker-images-${{ steps.version-hashes.outputs.docker-hash }}

    # CACHE-BINARIES: Try to restore previously built Lotus/Curio binaries
    - name: "CACHE_RESTORE: {C-build-artifacts-cache}"
      id: cache-binaries
      uses: actions/cache/restore@v4
      with:
        path: ~/.foc-devnet/bin
        key: ${{ runner.os }}-binaries-${{ steps.version-hashes.outputs.code-hash }}

    - name: "EXEC: {Ensure permissions on binaries}, DEP: {C-build-artifacts-cache}"
      if: steps.cache-binaries.outputs.cache-hit == 'true'
      run: sudo chown -R $USER:$USER ~/.foc-devnet/bin/

    # CACHE-GO: Try to restore foc-builder Go module cache to speed up Lotus/Curio builds
    - name: "CACHE_RESTORE: {C-foc-builder-cache}"
      id: cache-go
      if: steps.cache-binaries.outputs.cache-hit != 'true'
      uses: actions/cache/restore@v4
      with:
        path: ~/.foc-devnet/docker/volumes/cache/foc-builder
        key: ${{ runner.os }}-foc-builder-cache-${{ hashFiles('docker/**') }}-${{ hashFiles('src/config.rs') }}
        restore-keys: |
          ${{ runner.os }}-foc-builder-cache-

    - name: "EXEC: {Ensure permissions}, DEP: {C-foc-builder-cache}"
      if: steps.cache-binaries.outputs.cache-hit != 'true' &&
          steps.cache-go.outputs.cache-hit == 'true'
      run: sudo chown -R $USER:$USER ~/.foc-devnet/
      
    - name: "EXEC: {Check disk space}, independent"
      run: df -h

    # Build Lotus and Curio if not cached
    - name: "EXEC: {Build Lotus}, DEP: {C-build-artifacts-cache}"
      if: steps.cache-binaries.outputs.cache-hit != 'true'
      run: ./foc-devnet build lotus

    - name: "EXEC: {Build Curio}, DEP: {C-build-artifacts-cache}"
      if: steps.cache-binaries.outputs.cache-hit != 'true'
      run: ./foc-devnet build curio

    # CACHE-GO: Save Go module cache for future builds
    - name: "CACHE_SAVE: {C-foc-builder-cache}"
      if: steps.cache-binaries.outputs.cache-hit != 'true' &&
          steps.cache-go.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ~/.foc-devnet/docker/volumes/cache/foc-builder
        key: ${{ runner.os }}-foc-builder-cache-${{ hashFiles('docker/**') }}-${{ hashFiles('src/config.rs') }}

    # CACHE-BINARIES: Save built Lotus/Curio binaries for future runs
    - name: "CACHE_SAVE: {C-build-artifacts-cache}"
      if: steps.cache-binaries.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ~/.foc-devnet/bin
        key: ${{ runner.os }}-binaries-${{ steps.version-hashes.outputs.code-hash }}

    # Disk free-up
    - name: "EXEC: {Clean up Go modules}, DEP: {C-build-artifacts-cache}"
      run: |
        sudo rm -rf ~/.foc-devnet/docker/volumes/cache
        sudo rm -rf ~/.foc-devnet/code/lotus
        sudo rm -rf ~/.foc-devnet/code/curio
        df -h

    # Download and extract Filecoin proof parameters from S3
    - name: "EXEC: {Download proof parameters from S3}, independent"
      run: |
        mkdir -p ~/.foc-devnet/docker/volumes/cache/filecoin-proof-parameters/
        curl -L https://fil-proof-params-2k-cache.s3.us-east-2.amazonaws.com/filecoin-proof-params-2k.tar -o /tmp/filecoin-proof-params-2k.tar
        tar -xf /tmp/filecoin-proof-params-2k.tar -C ~/.foc-devnet/docker/volumes/cache/filecoin-proof-parameters/
        rm /tmp/filecoin-proof-params-2k.tar
        ls -lath ~/.foc-devnet/docker/volumes/cache/filecoin-proof-parameters/
        PROOF_PARAMS_HASH=$(find ~/.foc-devnet/docker/volumes/cache/filecoin-proof-parameters -type f -exec sha256sum {} \; | cut -d' ' -f1 | sort | sha256sum | cut -d' ' -f1)
        echo "Downloaded proof parameters with hash: $PROOF_PARAMS_HASH"

    # Verify cluster is running correctly
    - name: "EXEC: {Check cluster status}, independent"
      run: ./foc-devnet status

    # Configure /etc/hosts for inter-SP communication via host.docker.internal
    - name: "EXEC: {Configure host.docker.internal for SP-to-SP comms}, independent"
      run: echo '127.0.0.1 host.docker.internal' | sudo tee -a /etc/hosts

    # Start the full Filecoin localnet cluster
    - name: "EXEC: {Start cluster}, independent"
      id: start_cluster
      continue-on-error: true
      run: |
        if [ "${{ steps.init-flags.outputs.pdp-test }}" = "true" ]; then
          ./foc-devnet start --parallel --notest
        else
          ./foc-devnet start --parallel
        fi

    # On failure, collect and print Docker container logs for debugging
    - name: "EXEC: {Collect Docker logs on failure}, independent"
      run: |
        RUN_DIR="$HOME/.foc-devnet/state/latest"
        
        echo "+++++++++++ foc-devnet version"
        cat "$RUN_DIR/version.txt" 2>/dev/null || echo "No version file found"

        echo "+++++++++++ Disk space"
        sudo df -h 2>/dev/null || echo "df command failed"

        echo "+++++++++++ Run Directory Contents"
        ls -lath "$RUN_DIR" 2>/dev/null || echo "No run directory found"

        echo "+++++++++++ Contract Addresses"
        cat "$RUN_DIR/contract_addresses.json" 2>/dev/null || echo "No contract addresses file found"

        echo "+++++++++++ Step Context"
        cat "$RUN_DIR/step_context.json" 2>/dev/null || echo "No step context file found"

        echo "+++++++++++ FOC Metadata"
        cat "$RUN_DIR/foc_metadata.json" 2>/dev/null || echo "No foc metadata file found"

        echo "+++++++++++ Container Logs"
        if [ -d "$RUN_DIR/logs" ]; then
          for logfile in "$RUN_DIR/logs"/*; do
            if [ -f "$logfile" ]; then
              echo ""
              echo "📰 Logs from $(basename "$logfile") 📰"
              cat "$logfile" 2>/dev/null || echo "Failed to read $logfile"
            fi
          done
        else
          echo "No container logs directory found"
        fi

    # Verify cluster is running correctly
    - name: "EXEC: {Check cluster status}, independent"
      run: ./foc-devnet status

    - name: "EXEC: {List foc-* containers}, independent"
      run: |
        echo "Containers using foc-* images (running or exited):"
        docker ps -a --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}'

    # Verify devnet-info.json was exported successfully
    - name: "CHECK: {Verify devnet-info.json exists}"
      if: steps.start_cluster.outcome == 'success' && steps.init-flags.outputs.pdp-test != 'true'
      run: |
        DEVNET_INFO="$HOME/.foc-devnet/state/latest/devnet-info.json"
        test -f "$DEVNET_INFO" || exit 1
        echo "✓ devnet-info.json created"
        jq '.version' "$DEVNET_INFO"

    # Setup Node.js for JavaScript examples
    - name: "EXEC: {Setup Node.js}, independent"
      if: steps.start_cluster.outcome == 'success' && steps.init-flags.outputs.pdp-test != 'true'
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    # Validate schema using zod
    - name: "CHECK: {Validate devnet-info.json schema}"
      if: steps.start_cluster.outcome == 'success' && steps.init-flags.outputs.pdp-test != 'true'
      run: |
        DEVNET_INFO="$HOME/.foc-devnet/state/latest/devnet-info.json"
        cd examples
        npm install
        node validate-schema.js "$DEVNET_INFO"
        node read-devnet-info.js "$DEVNET_INFO"
        node check-balances.js "$DEVNET_INFO"
        echo "✓ All examples ran well"

    # ──────────────────────────────────────────────
    # PDP Caching Test Phase 5: Install test tooling (cqlsh, Node.js)
    # ──────────────────────────────────────────────
    - name: "EXEC: {Install cqlsh via Python venv}, independent"
      if: steps.init-flags.outputs.pdp-test == 'true' && steps.start_cluster.outcome == 'success'
      run: |
        sudo apt-get install -y python3.12-venv
        python3 -m venv ~/.foc-devnet/venv
        ~/.foc-devnet/venv/bin/pip install cqlsh

    - name: "EXEC: {Setup Node.js for PDP test}, independent"
      if: steps.init-flags.outputs.pdp-test == 'true' && steps.start_cluster.outcome == 'success'
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    # ──────────────────────────────────────────────
    # PDP Caching Test Phase 6: Extract devnet metadata
    # ──────────────────────────────────────────────
    - name: "CHECK: {Extract devnet info}"
      id: devnet-info
      if: steps.init-flags.outputs.pdp-test == 'true' && steps.start_cluster.outcome == 'success'
      run: |
        DEVNET_INFO="$HOME/.foc-devnet/state/latest/devnet-info.json"
        test -f "$DEVNET_INFO" || { echo "devnet-info.json not found" >&2; exit 1; }

        RUN_ID=$(jq -r '.info.run_id' "$DEVNET_INFO")
        echo "run-id=$RUN_ID" >> $GITHUB_OUTPUT

        YUGABYTE_CONTAINER="foc-${RUN_ID}-yugabyte-1"
        echo "yugabyte-container=$YUGABYTE_CONTAINER" >> $GITHUB_OUTPUT

        YCQL_PORT=$(docker port "$YUGABYTE_CONTAINER" 9042/tcp | head -1 | cut -d: -f2)
        echo "ycql-port=$YCQL_PORT" >> $GITHUB_OUTPUT

        echo "Run ID:              $RUN_ID"
        echo "Yugabyte container:  $YUGABYTE_CONTAINER"
        echo "YCQL port:           $YCQL_PORT"

    # ──────────────────────────────────────────────
    # PDP Caching Test Phase 7: Assert clean initial state
    # ──────────────────────────────────────────────
    - name: "CHECK: {Assert initial PDP state is clean}"
      if: steps.init-flags.outputs.pdp-test == 'true' && steps.start_cluster.outcome == 'success'
      env:
        YUGABYTE_CONTAINER: ${{ steps.devnet-info.outputs.yugabyte-container }}
        YCQL_PORT: ${{ steps.devnet-info.outputs.ycql-port }}
      run: |
        echo "=== Checking pdp_piecerefs (needs_save_cache should all be false) ==="
        PIECEREFS_OUTPUT=$(docker exec -e PGPASSWORD='yugabyte' "$YUGABYTE_CONTAINER" \
          /yugabyte/bin/ysqlsh -h localhost -p 5433 -U yugabyte -d yugabyte -t -A -c \
          "SELECT COUNT(*) FROM curio.pdp_piecerefs WHERE needs_save_cache = true")
        NEEDS_SAVE_COUNT=$(echo "$PIECEREFS_OUTPUT" | tr -d '[:space:]')
        echo "Pieces with needs_save_cache=true: $NEEDS_SAVE_COUNT"

        if [ "$NEEDS_SAVE_COUNT" != "0" ]; then
          echo "FAIL: Expected 0 pieces with needs_save_cache=true, got $NEEDS_SAVE_COUNT" >&2
          docker exec -e PGPASSWORD='yugabyte' "$YUGABYTE_CONTAINER" \
            /yugabyte/bin/ysqlsh -h localhost -p 5433 -U yugabyte -d yugabyte -c \
            "SELECT pr.id, pr.piece_cid, pr.needs_save_cache, pr.caching_task_started, pr.caching_task_completed FROM curio.pdp_piecerefs pr"
          exit 1
        fi

        echo "=== Checking pdp_cache_layer (should be empty) ==="
        CACHE_LAYER_OUTPUT=$(~/.foc-devnet/venv/bin/cqlsh localhost "$YCQL_PORT" \
          -u cassandra -p cassandra \
          -e "SELECT COUNT(*) FROM curio.pdp_cache_layer;")
        echo "Cache layer output: $CACHE_LAYER_OUTPUT"

        CACHE_COUNT=$(echo "$CACHE_LAYER_OUTPUT" | grep -oP '^\s*\K\d+' | head -1)
        echo "Cache layer row count: $CACHE_COUNT"

        if [ -n "$CACHE_COUNT" ] && [ "$CACHE_COUNT" != "0" ]; then
          echo "FAIL: Expected 0 rows in pdp_cache_layer, got $CACHE_COUNT" >&2
          ~/.foc-devnet/venv/bin/cqlsh localhost "$YCQL_PORT" -u cassandra -p cassandra \
            -e "SELECT * FROM curio.pdp_cache_layer;"
          exit 1
        fi

        echo "PASS: Initial PDP state is clean."

    # ──────────────────────────────────────────────
    # PDP Caching Test Phase 8: Run Synapse SDK e2e storage test
    # ──────────────────────────────────────────────
    - name: "EXEC: {Install Synapse SDK dependencies}, independent"
      if: steps.init-flags.outputs.pdp-test == 'true' && steps.start_cluster.outcome == 'success'
      run: |
        SYNAPSE_DIR="$HOME/.foc-devnet/code/synapse-sdk"
        if [ ! -d "$SYNAPSE_DIR" ]; then
          echo "synapse-sdk directory not found at $SYNAPSE_DIR" >&2
          ls -la "$HOME/.foc-devnet/code/" 2>/dev/null || echo "code dir does not exist"
          exit 1
        fi
        cd "$SYNAPSE_DIR"
        npm install

    - name: "EXEC: {Run Synapse e2e storage runner (10MB + 120MB)}, independent"
      if: steps.init-flags.outputs.pdp-test == 'true' && steps.start_cluster.outcome == 'success'
      id: synapse_e2e
      run: |
        cd "$HOME/.foc-devnet/code/synapse-sdk"
        NETWORK=devnet node utils/example-storage-e2e-runner.js 10MB 120MB

    # ──────────────────────────────────────────────
    # PDP Caching Test Phase 9: Wait for caching tasks and verify
    # ──────────────────────────────────────────────
    - name: "CHECK: {Wait for PDP SaveCache task to complete}"
      if: steps.init-flags.outputs.pdp-test == 'true' && steps.start_cluster.outcome == 'success'
      env:
        RUN_ID: ${{ steps.devnet-info.outputs.run-id }}
        YUGABYTE_CONTAINER: ${{ steps.devnet-info.outputs.yugabyte-container }}
      run: |
        echo "Waiting for PDPv0_SaveCache tasks to complete (max 10 minutes)..."
        MAX_WAIT=600
        POLL_INTERVAL=15
        ELAPSED=0

        while [ $ELAPSED -lt $MAX_WAIT ]; do
          PENDING=$(docker exec -e PGPASSWORD='yugabyte' "$YUGABYTE_CONTAINER" \
            /yugabyte/bin/ysqlsh -h localhost -p 5433 -U yugabyte -d yugabyte -t -A -c \
            "SELECT COUNT(*) FROM curio.pdp_piecerefs WHERE needs_save_cache = true AND caching_task_completed IS NULL")
          PENDING=$(echo "$PENDING" | tr -d '[:space:]')

          echo "[${ELAPSED}s] Pending caching tasks: $PENDING"

          if [ "$PENDING" = "0" ]; then
            echo "All caching tasks completed."
            break
          fi

          sleep $POLL_INTERVAL
          ELAPSED=$((ELAPSED + POLL_INTERVAL))
        done

        if [ $ELAPSED -ge $MAX_WAIT ]; then
          echo "TIMEOUT: Caching tasks did not complete within ${MAX_WAIT}s" >&2
          docker exec -e PGPASSWORD='yugabyte' "$YUGABYTE_CONTAINER" \
            /yugabyte/bin/ysqlsh -h localhost -p 5433 -U yugabyte -d yugabyte -c \
            "SELECT pr.id, pr.piece_cid, pr.needs_save_cache, pr.caching_task_started, pr.caching_task_completed FROM curio.pdp_piecerefs pr"
          exit 1
        fi

    - name: "CHECK: {Verify SaveCache in curio logs}"
      if: steps.init-flags.outputs.pdp-test == 'true' && steps.start_cluster.outcome == 'success'
      env:
        RUN_ID: ${{ steps.devnet-info.outputs.run-id }}
      run: |
        echo "=== Checking curio container logs for PDPv0_SaveCache ==="

        SAVE_CACHE_HITS=0
        for i in 1 2 3 4 5; do
          CONTAINER="foc-${RUN_ID}-curio-${i}"
          if docker ps -a --format '{{.Names}}' | grep -q "^${CONTAINER}$"; then
            echo "--- Logs from $CONTAINER ---"
            LOGS=$(docker logs "$CONTAINER" 2>&1 || true)
            MATCHES=$(echo "$LOGS" | grep -c "PDPv0_SaveCache: PDP layer cache saved" || true)
            echo "SaveCache 'saved' count in $CONTAINER: $MATCHES"
            SAVE_CACHE_HITS=$((SAVE_CACHE_HITS + MATCHES))
            echo "$LOGS" | grep "PDPv0_SaveCache" || true
            echo ""
          fi
        done

        echo "Total 'PDP layer cache saved' occurrences: $SAVE_CACHE_HITS"

        if [ "$SAVE_CACHE_HITS" -lt 1 ]; then
          echo "FAIL: Expected at least 1 'PDP layer cache saved' log line, got $SAVE_CACHE_HITS" >&2
          exit 1
        fi

        echo "PASS: Found $SAVE_CACHE_HITS SaveCache completion(s) in curio logs."

    - name: "CHECK: {Verify cache layers exist in YCQL}"
      if: steps.init-flags.outputs.pdp-test == 'true' && steps.start_cluster.outcome == 'success'
      env:
        YCQL_PORT: ${{ steps.devnet-info.outputs.ycql-port }}
      run: |
        echo "=== Checking pdp_cache_layer table for cached layers ==="
        CACHE_OUTPUT=$(~/.foc-devnet/venv/bin/cqlsh localhost "$YCQL_PORT" \
          -u cassandra -p cassandra \
          -e "SELECT * FROM curio.pdp_cache_layer;")
        echo "$CACHE_OUTPUT"

        ROW_COUNT=$(echo "$CACHE_OUTPUT" | grep -oP '\((\d+) rows?\)' | grep -oP '\d+' || echo "0")
        echo "Cache layer row count: $ROW_COUNT"

        if [ "$ROW_COUNT" = "0" ] || [ -z "$ROW_COUNT" ]; then
          echo "FAIL: Expected rows in pdp_cache_layer after e2e test, found none." >&2
          exit 1
        fi

        echo "PASS: Found $ROW_COUNT rows in pdp_cache_layer."

    - name: "CHECK: {Verify pdp_piecerefs final state}"
      if: steps.init-flags.outputs.pdp-test == 'true' && steps.start_cluster.outcome == 'success'
      env:
        YUGABYTE_CONTAINER: ${{ steps.devnet-info.outputs.yugabyte-container }}
      run: |
        echo "=== Final pdp_piecerefs state ==="
        docker exec -e PGPASSWORD='yugabyte' "$YUGABYTE_CONTAINER" \
          /yugabyte/bin/ysqlsh -h localhost -p 5433 -U yugabyte -d yugabyte -c \
          "SELECT pr.id, pr.piece_cid, pr.needs_save_cache, pr.caching_task_started, pr.caching_task_completed FROM curio.pdp_piecerefs pr"

        NEEDS_SAVE=$(docker exec -e PGPASSWORD='yugabyte' "$YUGABYTE_CONTAINER" \
          /yugabyte/bin/ysqlsh -h localhost -p 5433 -U yugabyte -d yugabyte -t -A -c \
          "SELECT COUNT(*) FROM curio.pdp_piecerefs WHERE needs_save_cache = true")
        NEEDS_SAVE=$(echo "$NEEDS_SAVE" | tr -d '[:space:]')

        echo "Pieces still needing cache save: $NEEDS_SAVE"
        if [ "$NEEDS_SAVE" != "0" ]; then
          echo "FAIL: Expected all needs_save_cache to be false after e2e, got $NEEDS_SAVE remaining" >&2
          exit 1
        fi

        echo "PASS: All piecerefs have needs_save_cache=false."

    # ──────────────────────────────────────────────
    # PDP Caching Test Phase 10: On-chain proving verification (placeholder)
    # ──────────────────────────────────────────────
    - name: "TODO: {Verify on-chain PDP proving}"
      if: steps.init-flags.outputs.pdp-test == 'true' && steps.start_cluster.outcome == 'success'
      run: |
        echo "============================================"
        echo "PLACEHOLDER: On-chain PDP proving verification"
        echo "============================================"
        echo ""
        echo "This step should verify that PDP proving works on-chain."
        echo "Implementation is pending - needs research on how to trigger"
        echo "and verify a PDP proving round via the devnet."
        echo ""
        echo "Skipping for now."

    # Clean shutdown
    - name: "EXEC: {Stop cluster}, independent"
      if: always()
      run: ./foc-devnet stop

    # Mark job as failed if the start step failed, but only after all steps
    - name: "CHECK: {Fail job if start failed}"
      if: ${{ always() && steps.start_cluster.outcome == 'failure' }}
      run: |
        echo "Start cluster failed earlier; marking job as failed." >&2
        exit 1
