# Volume mappings for curio Docker image
# Format: host_subdirectory = "container_path"
# Host paths will be relative to ~/.foc-devnet/artifacts/docker/volumes/curio/

[volumes]
# Curio repository data
".curio" = "/home/foc-user/.curio"
# Fast storage for sealing operations
"fast-storage" = "/home/foc-user/curio/fast-storage"
# Long-term storage for sealed sectors
"long-term-storage" = "/home/foc-user/curio/long-term-storage"
