[package]
name = "foc-devnet"
version = "1.0.0-rc.1"
edition = "2021"

[build-dependencies]
chrono = { version = "0.4", features = ["serde"] }

[dependencies]
clap = { version = "4.0", features = ["derive"] }
clap_complete = "4.0"
indicatif = "0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
dirs = "6.0"
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3.0"
regex = "1.0"
base64 = "0.23"
hex = "0.4"
bip39 = "2.0"
ethers-core = { version = "2.0", default-features = false }
sha3 = "0.12"
blake2 = "0.10"
base32 = "0.5"
crc32fast = "1.3"
bip32 = "0.5"
rand = "0.10"
bls-signatures = "0.15"
names = { version = "0.14", default-features = false }
shellexpand = "3"
flate2 = "1.0"
tar = "0.4"
reqwest = { version = "0.12", features = ["blocking"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
sha2 = "0.11"
num_cpus = "1.16"