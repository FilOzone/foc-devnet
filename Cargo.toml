[package]
name = "foc-localnet"
version = "0.1.0"
edition = "2021"

[build-dependencies]
chrono = { version = "0.4", features = ["serde"] }

[dependencies]
clap = { version = "4.0", features = ["derive"] }
clap_complete = "4.0"
indicatif = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
crossterm = "0.27"
dirs = "5.0"
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3.0"
downloader = "0.2"
tabular = { version = "0.2", features = ["ansi-cell"] }
regex = "1.0"
base64 = "0.21"
hex = "0.4"
bip39 = "2.0"
ethers-core = { version = "2.0", default-features = false }
sha3 = "0.10"
blake2 = "0.10"
base32 = "0.4"
crc32fast = "1.3"
bip32 = "0.5"
rand = "0.8"
bls-signatures = "0.15"
names = { version = "0.14", default-features = false }
flate2 = "1.0"
tar = "0.4"